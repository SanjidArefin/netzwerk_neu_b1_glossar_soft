<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000080">
    <title>B1 Glossar</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("b1-glossar-theme") || "blue";
      } catch {
        document.documentElement.dataset.theme = "blue";
      }
    </script>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">B1</div>
          <div>
            <p class="brand-kicker">Netzwerk neu</p>
            <h1>Glossar</h1>
          </div>
        </div>

        <nav class="chapter-nav" aria-label="Kapitel">
          <div class="nav-heading">
            <span>Kapitel</span>
            <span id="total-count">...</span>
          </div>
          <button class="chapter-tab is-active" type="button" data-chapter="all" aria-pressed="true">
            <span>Alle Kapitel</span>
            <span class="tab-count" id="all-count">...</span>
          </button>
          <div id="chapter-tabs"></div>
        </nav>

        <div class="sidebar-footer">
          <span class="footer-dot" aria-hidden="true"></span>
          <span id="load-status">Glossar wird geladen</span>
        </div>
      </aside>

      <main class="workspace">
        <header class="workspace-header">
          <div>
            <p class="section-kicker" id="chapter-label">Alle Kapitel</p>
            <h2 id="page-title">Wortschatz</h2>
          </div>
          <div class="header-actions">
            <label class="search-field" for="search-input">
              <span class="search-symbol" aria-hidden="true">&#8981;</span>
              <span class="sr-only">Wort oder Bedeutung suchen</span>
              <input
                id="search-input"
                type="search"
                autocomplete="off"
                spellcheck="false"
                placeholder="Wort oder Bedeutung suchen"
              >
              <button id="clear-search" class="clear-search" type="button" title="Suche leeren" aria-label="Suche leeren" hidden>
                &times;
              </button>
            </label>
            <button id="theme-toggle" class="theme-toggle" type="button" title="Blauer Modus aktivieren" aria-label="Blauer Modus aktivieren" aria-pressed="false">
              <span class="theme-toggle-icon" aria-hidden="true">&#9790;</span>
            </button>
          </div>
        </header>

        <section class="word-list-panel" aria-labelledby="page-title">
          <header class="list-header">
            <div class="list-label list-label-word">
              <span>Deutsch</span>
              <span class="list-summary">
                <span id="result-count">0 Eintraege</span>
                <span class="sort-note">A-Z</span>
              </span>
            </div>
            <span class="list-label">English</span>
            <span class="list-label list-label-chapter">Kapitel</span>
          </header>
          <nav id="alphabet-jump" class="alphabet-jump" aria-label="Zu Buchstabe springen"></nav>
          <div id="word-list" class="word-list" role="listbox" aria-label="Glossareintraege"></div>
        </section>
      </main>
    <script src="./glossary-model.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
